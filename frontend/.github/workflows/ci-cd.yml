name: CI - Lint

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (lint test)
        run: npm run lint

      - name: Upload lint report
        if: always()
        run: echo "Lint completed successfully" > lint-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
